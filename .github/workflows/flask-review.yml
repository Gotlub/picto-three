name: 🐍 Flask Code Review & Tests

# Se lance à chaque push, sur n'importe quelle branche
on: [push]

jobs:
  review-python:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : On installe Python (je mets 3.11, modifie si tu utilises 3.10 ou 3.12)
      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Astuce : GitHub garde les paquets en cache pour accélérer les prochains runs

      # Étape 3 : Installation de tes extensions
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff # On force l'installation du linter

      # Étape 4 : Le Linter (Cherche le code mort, les variables non utilisées, les imports foireux)
      - name: 🕵️‍♂️ Analyse du code statique (Ruff)
        run: ruff check .

      # Étape 5 : Les tests unitaires
      - name: 🧪 Tests automatisés (Pytest)
        run: pytest -v

      # Étape 6 : Analyse statique JavaScript (ESLint)
      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances JS
        run: npm install

      - name: 🕵️‍♂️ Analyse du code JavaScript (ESLint)
        run: npx eslint "app/static/js/**/*.js"

      # Étape 7 : Tests unitaires JavaScript
      - name: 🧪 Tests unitaires JavaScript (Node test runner)
        run: npm test

  e2e:
    name: E2E Chromium / PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Separate checkout: pytest currently mutates a static image fixture.
      - uses: actions/checkout@v4

      - name: Run isolated E2E stack
        run: bash tests/e2e/run.sh

      - name: Upload E2E reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-postgresql
          path: tests/e2e/artifacts/
          retention-days: 7
          if-no-files-found: warn
