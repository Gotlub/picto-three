services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Stockage persistant des images utilisateurs via le volume nommé pictograms_data
      - pictograms_data:/app/app/static
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pictotree}
      - PICTOGRAMS_PATH=/app/app/static/pictograms
      - PICTOGRAMS_PATH_MIN=/app/app/static/pictogramsmin
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pictotree}
    # En production, on n'expose pas le port 5432 vers l'extérieur pour la sécurité
    volumes:
      # Persistance des données PostgreSQL via volume nommé
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pictotree}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  pictograms_data:
    driver: local
